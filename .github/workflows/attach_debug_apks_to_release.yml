name: Attach Debug APKs To Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag"
        required: true
        default: "v1.0.8.1"
      release_name:
        description: "GitHub release title"
        required: true
        default: "v1.0.8.1"
      release_notes:
        description: "GitHub release notes"
        required: false
        default: '## 中文\n\n本期新增 termux-ui 模块，为 Windows 应用、Linux 桌面、文件和运行组件提供统一图形界面。\n\n- Windows 应用与游戏：通过独立的 Wine 环境导入、配置、管理和运行程序。\n- Linux 桌面：创建、启动、管理和重新安装 Native 与 PRoot 桌面环境。\n- 运行组件：下载和管理 Wine、Box64、图形及配套组件，支持自定义 Wine 和 Box64 版本。\n- 文件管理：浏览文件、批量操作、查看文件信息，并将检测到的 Windows 程序导入程序库。\n- 输入与显示：按程序配置显示设置、键盘鼠标输入、虚拟按键和游戏手柄。\n- 备份与恢复：导出和恢复 PRoot 桌面容器、Wine 环境及 Wine C 盘。\n\n## English\n\nIntroduce the new termux-ui module with a unified graphical interface for Windows applications, Linux desktops, files, and runtime components.\n\n- Windows apps and games: import, configure, manage, and launch programs with dedicated Wine environments.\n- Linux desktops: create, launch, manage, and reinstall Native and PRoot desktop environments.\n- Runtime components: download and manage Wine, Box64, graphics, and supporting components, including custom Wine and Box64 builds.\n- File management: browse files, perform batch operations, view file details, and import detected Windows programs.\n- Input and display: configure per-program display settings, keyboard and mouse input, virtual controls, and game controllers.\n- Backup and recovery: export and restore PRoot desktop containers, Wine environments, and Wine C drives.'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_REF }}
          submodules: 'true'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Build
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          # Set RELEASE_VERSION_NAME to "<CURRENT_VERSION_NAME>+<last_commit_hash>"
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}" # The "+" is necessary so that versioning precedence is not affected
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+${{ env.PACKAGE_VARIANT }}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "Building APKs for 'APK_VERSION_TAG' release"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          ./gradlew assembleDebug

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              echo "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
              exit 1
            fi
          done
      - name: Upload APKs to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_variant }}
          path: ./app/build/outputs/apk/debug/*.apk
  upload:
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
      - name: Rename APKs for release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_APK_DIR="release-apks"
          mkdir -p "$RELEASE_APK_DIR"

          for apk in ./**/*.apk; do
            filename="$(basename "$apk")"
            short_name="$(printf '%s\n' "$filename" \
              | sed -E 's/\+[0-9a-f]{7}\+/\+/' \
              | sed -E 's/-github-debug//')"
            cp "$apk" "$RELEASE_APK_DIR/$short_name"
          done

          ls -la "$RELEASE_APK_DIR"
      - name: Create or update release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          notes = os.environ["RELEASE_NOTES"].replace("\\n", "\n")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PYTHON

          release_args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_NAME")
          if [[ -n "$RELEASE_NOTES" ]]; then
            release_args+=(--notes-file release-notes.md)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md
          fi
      - name: Upload or replace APKs and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release-apks/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs found for release" >&2
            exit 1
          fi

          for algorithm in sha256 sha512 md5; do
            checksum_file="CHECKSUMS-$algorithm.txt"
            : > "$checksum_file"
            for apk in "${apks[@]}"; do
              digest="$("${algorithm}sum" "$apk")"
              printf '%s\t%s\n' "$apk" "${digest%% *}" >> "$checksum_file"
            done
          done

          gh release upload "$RELEASE_TAG" "${apks[@]}" \
            CHECKSUMS-sha256.txt CHECKSUMS-sha512.txt CHECKSUMS-md5.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
