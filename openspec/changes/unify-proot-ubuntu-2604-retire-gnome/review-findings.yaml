schema: review_findings_v1
status: CHANGES_REQUESTED
scope: 继续修复和验证；会话与实际应用已推进，Mutter 生命周期修复已通过设备压力及退出清理，保存／启动分离已定向验证；完整安装链仍不可发布
findings:
  - id: GNOME50_DISPLAY_ARCHITECTURE
    severity: blocker
    status: resolved
    description: 用户已确认移植现有 Android 后端并升级原生组件，排除 PipeWire 显示桥。
  - id: NEW_ABI_NATIVE_BUILD
    severity: blocker
    status: resolved
    description: 四个新版本组件已在原编译链构建，通过官方 ELF 检查，全部新 ABI GType dump 均已在 Android 真实生成并记录来源。
  - id: INSTALLER_RUNTIME_COHERENCE
    severity: blocker
    status: open
    description: 安装器已同步真实 GNOME 50 核心、Resolute 适配和 Native Ubuntu 50 外观哈希，GNOME 不再依赖 Xlorie；两组组件已公开发布并通过 22 项公开下载字节校验，Native 独立 GTK 应用组合与四类新安装仍未实测，仍不可发布 APK。
  - id: PROOT_SHELL_BUS_READINESS
    severity: blocker
    status: resolved
    description: 探针使用同一普通用户 PRoot 及 session.env，实际通过总线、全部扩展、DING 窗口和终端输入；真实 D-Bus 与生命周期回归通过。
  - id: MUTTER_REENTRANT_VISIBILITY_QUEUE
    severity: blocker
    status: resolved
    description: 已复现销毁后仍入队的 139 崩溃。修正两处回调后清标记，原版与不完整初版回归均失败，完整补丁通过；50.1-3 与 50.1-4 均通过无探针 8 次重启和完整清理；r4 为 9 个所属进程。
  - id: FULL_RUNTIME_VALIDATION
    severity: high
    status: open
    description: PRoot 实际窗口、四扩展、终端身份及键盘输入、Nautilus 已验证；快速设置视觉已确认，实际鼠标点击、Native 50 全套 GUI 和四类全新安装仍待验证，GIO 未测试真实 USB。
  - id: INSTALLER_TEST_COVERAGE
    severity: high
    status: open
    description: Ubuntu GNOME 16、Plasma 安装 11、保存 5、GNOME 会话 15／进程 31／管理生命周期 17 及 Java 801 项通过；宽泛旧 desktop-scripts 夹具仍依赖旧运行路径和启动时缓存，未通过，不能宣称全仓库脚本回归完成。

  - id: SAVE_ONLY_INITIALIZATION
    severity: high
    status: resolved
    description: 按用户纠正移除启动阶段静态校验、默认配置生成、主题及缓存初始化和文件部署；保存完成才发布会话描述。实际冷启动未重写静态文件，缺少保存结果直接失败，无自动初始化／修复。

  - id: COMPONENT_PUBLICATION
    severity: high
    status: resolved
    description: 用户明确授权组件发布。GNOME 50 核心／GIO／Glycin 与 Native Ubuntu 外观已在组件仓库公开为集成验证版；22 个组件资产及既有上游 Mesa 均从原始公开 URL 回读并验证大小／SHA256，App 固定清单一致；不等同于整体验收。

  - id: FRESH_INSTALL_GLYCIN_DEPLOYMENT
    severity: high
    status: resolved
    description: 设备全新安装在复制 Glycin 助手时失败，原因是 APK 资源未列入 App 部署数组。补齐安装／保存阶段部署，无启动路径改动；新增实际 App 资源部署负正对照回归。用户要求自行完成完整安装验收。
