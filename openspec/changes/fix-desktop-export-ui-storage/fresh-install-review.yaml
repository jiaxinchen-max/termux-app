schema: review_findings_v1
scope: 全新宿主恢复时 API 入口被软件源包替换为符号链接
reviewer: 实施代理直接源代码自审，非独立评审
findings: []
evidence:
  - 现场归档任务确认 host-only 成功，初始化派发 API 校验失败
  - 设备 termux-api 0.60.0 的入口指向 termux-api-broadcast
  - 5 项新增复现测试在原代码全部失败
  - API 安装器 20 项及恢复派发 3 项回归通过
  - 检查匹配不读取链接目标，替换和回滚 rename 链接本身，临时清理仅 unlink
  - 父目录链接、其他 API 路径及归档成员链接继续拒绝
  - 真实宿主离线 API 安装器 BEFORE_MATCH=false / AFTER_MATCH=true / exit 0
  - 原失败任务离线恢复初始化 state=succeeded / exitCode=0，无装包或下载
limitations:
  - 新 APK 完整 UI 导入仍待验收
  - 严格 Harness 脚本缺失

host_package_registration_followup:
  authorization: 用户明确要求完善定制 API 包管理；沿用任务完成后推送保存进度授权
  reviewer: 实施代理直接源代码自审，非独立评审
  findings: []
  checks:
    - 恢复与完整安装使用同一函数，且均位于最后一次 apt 操作之后
    - 本地 DEB 包名与安装后 configured 状态和版本核验，hold 失败阻断
    - 已经 hold 的 UPower 仍被识别，支持 App 后续定制包更新
    - 未改变容器安装、归档解包、安全路径或用户文件
    - 实际设备强制停止 App 后定制 API 与 UPower 登记成功、hold 生效、dpkg audit 无输出
  limitations:
    - hold 可被用户 unhold 或显式允许改变 held 包覆盖；入口事务修复继续保留
    - 完整 UI 导入未验收；未安装新 APK
    - 旧 GNOME 套件 42 项中存在 33 项旧渲染参数失败，HEAD 基线复跑同样失败
    - Harness 严格门禁缺失
  local_verification:
    - 宿主恢复预检 54 个夹具全部通过
    - 恢复本地初始化 9 项通过
    - shell 语法与 git diff 检查通过

kwin_theme_followup:
  reviewer: 实施代理直接源代码自审，非独立评审
  findings: []
  evidence:
    - 现场导入成功，宿主 QKdeTheme 创建路径崩溃，受控 A/B generic 越过崩溃点
    - 主题仅覆盖 compositor Popen 的 env 副本，不修改父环境或容器环境
    - 旧代码主题隔离复现失败，修复后会话 10 项全部通过
    - clean APK 签名及 HTTP 哈希核对通过，43.28 MiB，无 testOnly
  limitations:
    - 完整 UI 可视验收未完成
    - 初始化大套件存在缺 CA 和缺主题归档的夹具失败，未宣称全绿
    - Harness 严格门禁缺失
