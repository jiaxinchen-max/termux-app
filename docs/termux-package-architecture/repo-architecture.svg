<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">termux-packages repository architecture</title>
  <desc id="desc">Repository channels, build system, output packages, package repositories, and Termux app consumption path.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.4; rx: 10; }
      .box2 { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; rx: 10; }
      .box3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; rx: 10; }
      .box4 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; rx: 10; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px Arial, sans-serif; fill: #1e293b; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="560"/>
  <text class="title" x="40" y="42">termux-packages Architecture</text>

  <rect class="panel" x="40" y="75" width="300" height="395"/>
  <text class="section" x="65" y="106">Repository root</text>
  <rect class="box" x="65" y="130" width="250" height="54"/>
  <text class="text" x="85" y="153">packages/</text>
  <text class="small" x="85" y="171">main channel recipes</text>
  <rect class="box" x="65" y="200" width="250" height="54"/>
  <text class="text" x="85" y="223">root-packages/</text>
  <text class="small" x="85" y="241">root channel recipes</text>
  <rect class="box" x="65" y="270" width="250" height="54"/>
  <text class="text" x="85" y="293">x11-packages/</text>
  <text class="small" x="85" y="311">x11 channel recipes</text>
  <rect class="box" x="65" y="340" width="250" height="54"/>
  <text class="text" x="85" y="363">disabled-packages/</text>
  <text class="small" x="85" y="381">excluded recipes</text>
  <rect class="box" x="65" y="410" width="250" height="38"/>
  <text class="text" x="85" y="434">repo.json maps channels</text>

  <rect class="panel" x="400" y="75" width="285" height="395"/>
  <text class="section" x="425" y="106">Build system</text>
  <rect class="box2" x="425" y="132" width="235" height="56"/>
  <text class="text" x="445" y="156">build-package.sh</text>
  <text class="small" x="445" y="174">main package build entry</text>
  <rect class="box2" x="425" y="210" width="235" height="56"/>
  <text class="text" x="445" y="234">scripts/</text>
  <text class="small" x="445" y="252">helpers, docker, build steps</text>
  <rect class="box2" x="425" y="288" width="235" height="56"/>
  <text class="text" x="445" y="312">scripts/properties.sh</text>
  <text class="small" x="445" y="330">core paths, NDK, API</text>
  <rect class="box2" x="425" y="366" width="235" height="56"/>
  <text class="text" x="445" y="390">ndk-patches/</text>
  <text class="small" x="445" y="408">Android sysroot patches</text>

  <rect class="panel" x="745" y="75" width="315" height="395"/>
  <text class="section" x="770" y="106">Products and consumers</text>
  <rect class="box3" x="770" y="132" width="255" height="56"/>
  <text class="text" x="790" y="156">output/</text>
  <text class="small" x="790" y="174">local .deb or .pkg.tar.xz</text>
  <rect class="box3" x="770" y="220" width="255" height="56"/>
  <text class="text" x="790" y="244">packages.termux.dev</text>
  <text class="small" x="790" y="262">main, root, x11 repos</text>
  <rect class="box4" x="770" y="322" width="255" height="76"/>
  <text class="text" x="790" y="347">Termux app rootfs</text>
  <text class="small" x="790" y="365">apt/pkg installs into prefix</text>
  <text class="small" x="790" y="383">/data/data/com.termux/files/usr</text>

  <path class="line" d="M340 270 C365 270 372 270 400 270"/>
  <path class="line" d="M685 160 C710 160 720 160 745 160"/>
  <path class="line" d="M900 188 L900 220"/>
  <path class="line" d="M900 276 L900 322"/>
  <path class="line" d="M542 422 C542 500 900 500 900 400"/>
  <text class="small" x="460" y="510">build variables must match app package name, data dir, and prefix</text>
</svg>
