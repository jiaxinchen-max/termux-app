<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">Termux package path model</title>
  <desc id="desc">Relationship between properties.sh core variables, package build output, official package repository, and Termux app filesystem paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.4; rx: 10; }
      .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; rx: 10; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; rx: 10; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.4; rx: 10; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px Arial, sans-serif; fill: #1e293b; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="530"/>
  <text class="title" x="40" y="42">Path Model and App Coupling</text>

  <rect class="panel" x="40" y="78" width="310" height="360"/>
  <text class="section" x="65" y="110">scripts/properties.sh</text>
  <rect class="box" x="65" y="134" width="260" height="46"/>
  <text class="text" x="85" y="162">TERMUX_APP__PACKAGE_NAME</text>
  <rect class="box" x="65" y="194" width="260" height="46"/>
  <text class="text" x="85" y="222">TERMUX_APP__DATA_DIR</text>
  <rect class="box" x="65" y="254" width="260" height="46"/>
  <text class="text" x="85" y="282">TERMUX__ROOTFS</text>
  <rect class="box" x="65" y="314" width="260" height="46"/>
  <text class="text" x="85" y="342">TERMUX_ANDROID_HOME</text>
  <rect class="box" x="65" y="374" width="260" height="46"/>
  <text class="text" x="85" y="402">TERMUX__PREFIX</text>

  <rect class="panel" x="420" y="78" width="295" height="360"/>
  <text class="section" x="445" y="110">Default com.termux paths</text>
  <rect class="ok" x="445" y="134" width="245" height="56"/>
  <text class="text" x="465" y="158">/data/data/com.termux</text>
  <text class="small" x="465" y="176">app private data dir</text>
  <rect class="ok" x="445" y="214" width="245" height="56"/>
  <text class="text" x="465" y="238">/files</text>
  <text class="small" x="465" y="256">rootfs under data dir</text>
  <rect class="ok" x="445" y="294" width="245" height="56"/>
  <text class="text" x="465" y="318">/files/home</text>
  <text class="small" x="465" y="336">Termux home</text>
  <rect class="ok" x="445" y="374" width="245" height="56"/>
  <text class="text" x="465" y="398">/files/usr</text>
  <text class="small" x="465" y="416">Termux prefix</text>

  <rect class="panel" x="785" y="78" width="275" height="360"/>
  <text class="section" x="810" y="110">Compatibility rule</text>
  <rect class="warn" x="810" y="134" width="225" height="74"/>
  <text class="text" x="830" y="158">Official packages</text>
  <text class="small" x="830" y="176">built for default variables</text>
  <text class="small" x="830" y="194">safe with matching app</text>
  <rect class="bad" x="810" y="244" width="225" height="78"/>
  <text class="text" x="830" y="268">Custom app package</text>
  <text class="small" x="830" y="286">must rebuild package repo</text>
  <text class="small" x="830" y="304">do not mix prefixes</text>
  <rect class="warn" x="810" y="358" width="225" height="56"/>
  <text class="text" x="830" y="382">Patch FHS paths</text>
  <text class="small" x="830" y="400">use @TERMUX_PREFIX@</text>

  <path class="line" d="M350 157 C385 157 398 157 445 157"/>
  <path class="line" d="M350 397 C385 397 398 397 445 397"/>
  <path class="line" d="M690 397 C735 397 765 386 810 386"/>
  <path class="line" d="M690 162 C735 162 765 171 810 171"/>
  <path class="dash" d="M690 397 C750 455 900 455 922 322"/>
  <text class="small" x="55" y="475">All installed files, shebangs, config paths, and runtime linker assumptions must agree on the same prefix.</text>
</svg>
